  {
    id:"b10", level:"B",
    title:"Why Languages Die",
    subtitle:"Cómo las presiones económicas y sociales hacen desaparecer lenguas enteras.",
    text:`Of the roughly seven thousand languages spoken in the world today, linguists estimate that a significant portion could disappear within this century, many of them well before they have ever been thoroughly documented. Language loss rarely results from a single dramatic event; more often, it unfolds gradually across generations, as economic pressure, migration, and shifting social prestige combine to make a dominant language more practical for daily life, education, and employment. Parents, hoping to give their children better opportunities, may choose to speak that dominant language at home, even when they themselves grew up speaking a minority language fluently. Over two or three generations, children grow up understanding but not speaking the ancestral language, and eventually that understanding fades as well. Linguists argue that language loss carries consequences that extend beyond communication itself. Each language encodes a distinct way of organizing knowledge about the natural world, kinship, time, and causation, accumulated over centuries of lived experience within a particular environment. When a language disappears, that accumulated knowledge, including traditional ecological understanding, oral histories, and unique grammatical structures found nowhere else, disappears alongside it. Revitalization efforts, ranging from community language schools to digital archiving projects, have shown some success in slowing this process, though linguists generally agree that sustained revitalization requires far more than academic documentation: it requires communities themselves choosing, generation after generation, to keep a language alive as a living, spoken practice rather than a preserved artifact.`,
    translation:`De las aproximadamente siete mil lenguas que se hablan hoy en el mundo, los lingüistas estiman que una parte significativa podría desaparecer dentro de este siglo, muchas de ellas mucho antes de haber sido documentadas a fondo. La pérdida de una lengua rara vez resulta de un solo evento dramático; con más frecuencia, ocurre gradualmente a lo largo de generaciones, a medida que la presión económica, la migración y el prestigio social cambiante se combinan para hacer que una lengua dominante sea más práctica para la vida diaria, la educación y el empleo. Los padres, con la esperanza de dar a sus hijos mejores oportunidades, pueden elegir hablar esa lengua dominante en casa, incluso cuando ellos mismos crecieron hablando con fluidez una lengua minoritaria. En el transcurso de dos o tres generaciones, los niños crecen entendiendo pero no hablando la lengua ancestral, y eventualmente esa comprensión también se desvanece. Los lingüistas argumentan que la pérdida de una lengua conlleva consecuencias que van más allá de la comunicación misma. Cada lengua codifica una manera distinta de organizar el conocimiento sobre el mundo natural, el parentesco, el tiempo y la causalidad, acumulado a lo largo de siglos de experiencia vivida dentro de un entorno particular. Cuando una lengua desaparece, ese conocimiento acumulado, incluyendo la comprensión ecológica tradicional, las historias orales y estructuras gramaticales únicas que no se encuentran en ninguna otra parte, desaparece junto con ella. Los esfuerzos de revitalización, que van desde escuelas comunitarias de lengua hasta proyectos de archivo digital, han mostrado cierto éxito en frenar este proceso, aunque los lingüistas generalmente coinciden en que una revitalización sostenida requiere mucho más que documentación académica: requiere que las propias comunidades elijan, generación tras generación, mantener una lengua viva como una práctica hablada y viva, en lugar de un artefacto conservado.`,

  {
    id:"b11", level:"B",
    title:"The Psychology of Color in Marketing",
    subtitle:"Por qué la consistencia importa más que el significado de un solo color.",
    text:`Marketing professionals have long assumed that color choice influences consumer behavior, and a substantial body of research supports the general idea, even though the specific mechanisms are more nuanced than popular claims often suggest. Contrary to widely circulated infographics claiming that red increases appetite or blue signals trustworthiness for every person in every context, researchers emphasize that color perception is heavily shaped by cultural background, personal experience, and situational context, making universal rules unreliable. What research does support more consistently is that color contributes to a brand's overall impression through consistency rather than any single color's inherent meaning. Brands that use color reliably across packaging, advertising, and digital platforms tend to be recognized more quickly and remembered more accurately than brands that vary their palette unpredictably. Color also interacts with expectation: a technology company using a palette typically associated with organic food products may create subtle cognitive friction, since consumers unconsciously compare new stimuli against category norms built from years of exposure to similar products. This explains why disruptive brands sometimes deliberately violate color expectations to stand out, accepting short-term unfamiliarity in exchange for long-term memorability. Ultimately, the effective use of color in marketing depends less on universal psychological triggers and more on strategic consistency, category awareness, and a clear understanding of the specific audience a brand intends to reach.`,
    translation:`Los profesionales del marketing han asumido durante mucho tiempo que la elección del color influye en el comportamiento del consumidor, y un cuerpo sustancial de investigación respalda la idea general, aunque los mecanismos específicos son más matizados de lo que sugieren a menudo las afirmaciones populares. Contrario a las infografías ampliamente difundidas que afirman que el rojo aumenta el apetito o que el azul señala confiabilidad para toda persona en todo contexto, los investigadores enfatizan que la percepción del color está fuertemente moldeada por el trasfondo cultural, la experiencia personal y el contexto situacional, lo cual hace poco confiables las reglas universales. Lo que la investigación sí respalda de manera más consistente es que el color contribuye a la impresión general de una marca a través de la consistencia, más que por el significado inherente de un solo color. Las marcas que usan el color de manera constante en su empaque, publicidad y plataformas digitales tienden a ser reconocidas más rápidamente y recordadas con mayor precisión que las marcas que varían su paleta de forma impredecible. El color también interactúa con la expectativa: una empresa de tecnología que use una paleta típicamente asociada con productos alimenticios orgánicos puede crear una sutil fricción cognitiva, ya que los consumidores comparan inconscientemente los nuevos estímulos con las normas de la categoría construidas a partir de años de exposición a productos similares. Esto explica por qué algunas marcas disruptivas violan deliberadamente las expectativas de color para destacar, aceptando cierta falta de familiaridad a corto plazo a cambio de mayor memorabilidad a largo plazo. En última instancia, el uso efectivo del color en el marketing depende menos de disparadores psicológicos universales y más de la consistencia estratégica, la conciencia de categoría y una comprensión clara de la audiencia específica a la que una marca pretende llegar.`,

  {
    id:"b12", level:"B",
    title:"How Social Media Shapes Memory",
    subtitle:"El efecto de fotografiar cada momento sobre cómo lo recordamos después.",
    text:`Long before smartphones, people relied primarily on their own recollection, supplemented occasionally by photographs or written journals, to preserve memories of significant events. Today, many experiences are documented almost instantly through photos, videos, and posts shared on social media, a shift that researchers argue is subtly reshaping how memory itself functions. One consistent finding is that the act of photographing an experience, particularly when done frequently or with the primary goal of sharing it later, can reduce how vividly a person remembers the moment firsthand, a phenomenon sometimes called the photo-taking impairment effect. Attention devoted to capturing the perfect image appears to compete with attention devoted to actually experiencing the event, leaving a thinner memory trace despite the visual record. At the same time, social media introduces a new complication: constant exposure to curated, filtered versions of other people's experiences can distort a person's sense of what is normal or expected, a dynamic linked in various studies to increased anxiety and lower life satisfaction, particularly among younger users who have grown up with near-constant social comparison. Some researchers also note a more subtle effect on autobiographical memory itself: because social media posts become an externalized, edited record of the past, people may gradually come to rely on that curated version rather than their own internal recollection, effectively outsourcing part of their personal history to a platform designed primarily to maximize engagement rather than to preserve memory accurately.`,
    translation:`Mucho antes de los teléfonos inteligentes, las personas dependían principalmente de su propio recuerdo, complementado ocasionalmente con fotografías o diarios escritos, para preservar memorias de eventos importantes. Hoy en día, muchas experiencias se documentan casi instantáneamente mediante fotos, videos y publicaciones compartidas en redes sociales, un cambio que los investigadores argumentan está moldeando sutilmente el funcionamiento de la memoria misma. Un hallazgo consistente es que el acto de fotografiar una experiencia, particularmente cuando se hace con frecuencia o con el objetivo principal de compartirla después, puede reducir la viveza con que una persona recuerda el momento de primera mano, un fenómeno a veces llamado el efecto de deterioro por tomar fotos. La atención dedicada a capturar la imagen perfecta parece competir con la atención dedicada a vivir realmente el evento, dejando una huella de memoria más débil a pesar del registro visual. Al mismo tiempo, las redes sociales introducen una nueva complicación: la exposición constante a versiones curadas y filtradas de las experiencias de otras personas puede distorsionar el sentido de lo que es normal o esperado, una dinámica vinculada en varios estudios con mayor ansiedad y menor satisfacción con la vida, particularmente entre usuarios más jóvenes que han crecido con una comparación social casi constante. Algunos investigadores también señalan un efecto más sutil sobre la memoria autobiográfica misma: debido a que las publicaciones en redes sociales se convierten en un registro externalizado y editado del pasado, las personas pueden llegar gradualmente a depender de esa versión curada en lugar de su propio recuerdo interno, externalizando efectivamente parte de su historia personal a una plataforma diseñada principalmente para maximizar la interacción, no para preservar la memoria con precisión.`,

      { q:"According to the text, what may happen to autobiographical memory as people rely on social media posts?",

  {
    id:"c1", level:"C",
    title:"The Architecture of Memory",
    subtitle:"Un texto académico sobre neurociencia y la naturaleza reconstructiva de la memoria.",
    text:`Memory, contrary to popular belief, does not function like a video recorder that faithfully preserves every detail of an experience for later retrieval. Instead, contemporary neuroscience describes memory as a reconstructive process, one in which the brain assembles a plausible narrative each time an event is recalled, drawing on fragments stored across distributed neural networks. This distinction carries significant consequences, particularly in domains such as eyewitness testimony, where a witness's confident recollection may nonetheless diverge substantially from what actually occurred. Researchers studying the hippocampus, a seahorse-shaped structure nestled deep within the temporal lobe, have demonstrated that this region acts less like a filing cabinet and more like an editor, continuously revising and consolidating memories during both waking hours and sleep. Each act of remembering, in fact, appears to render a memory temporarily unstable, susceptible to subtle alteration before it is filed away again, a phenomenon known as reconsolidation. This helps explain why repeated retelling of a story can gradually distort its details, even when the storyteller has no intention to deceive. Emotional intensity further complicates the picture: highly charged experiences are often recalled with greater vividness and confidence, yet vividness does not guarantee accuracy, and traumatic memories in particular can be marked by striking inconsistencies. Understanding memory as a fundamentally reconstructive faculty, rather than a static archive, has reshaped fields ranging from clinical psychology to legal practice, prompting courts in several countries to treat uncorroborated eyewitness testimony with considerably more caution than they once did. The implications extend beyond the courtroom, inviting a broader reconsideration of how much we should trust the vivid certainty of our own recollections.`,
    translation:`La memoria, contrariamente a la creencia popular, no funciona como una videograbadora que preserva fielmente cada detalle de una experiencia para su recuperación posterior. En cambio, la neurociencia contemporánea describe la memoria como un proceso reconstructivo, en el cual el cerebro arma una narrativa plausible cada vez que se recuerda un evento, basándose en fragmentos almacenados en redes neuronales distribuidas. Esta distinción tiene consecuencias importantes, particularmente en ámbitos como el testimonio de testigos oculares, donde el recuerdo seguro de un testigo puede, sin embargo, diferir sustancialmente de lo que realmente ocurrió. Los investigadores que estudian el hipocampo, una estructura con forma de caballito de mar ubicada en lo profundo del lóbulo temporal, han demostrado que esta región actúa menos como un archivero y más como un editor, revisando y consolidando continuamente los recuerdos tanto durante las horas de vigilia como durante el sueño. Cada acto de recordar, de hecho, parece volver un recuerdo temporalmente inestable, susceptible a una alteración sutil antes de ser archivado nuevamente, un fenómeno conocido como reconsolidación. Esto ayuda a explicar por qué contar una historia repetidamente puede distorsionar gradualmente sus detalles, incluso cuando quien la narra no tiene ninguna intención de engañar. La intensidad emocional complica aún más el panorama: las experiencias muy cargadas emocionalmente suelen recordarse con mayor viveza y seguridad, pero la viveza no garantiza exactitud, y los recuerdos traumáticos en particular pueden estar marcados por inconsistencias sorprendentes. Comprender la memoria como una facultad fundamentalmente reconstructiva, en lugar de un archivo estático, ha transformado campos que van desde la psicología clínica hasta la práctica legal, llevando a los tribunales de varios países a tratar el testimonio ocular no corroborado con considerablemente más cautela que antes. Las implicaciones se extienden más allá de la sala del tribunal, invitando a una reconsideración más amplia de cuánto deberíamos confiar en la vívida certeza de nuestros propios recuerdos.`,

// Índice rápido por id, usado por los popups de vocabulario
const readingsById = {};
readings.forEach(r => readingsById[r.id] = r);


/* =========================================================================
   2. RENDER — construir las tarjetas de lectura en el DOM
   ========================================================================= */

const levelLabels = { A:"Nivel A · Básico", B:"Nivel B · Intermedio", C:"Nivel C · Avanzado" };

function tokenizeToFragment(text){
  const frag = document.createDocumentFragment();
  const tokens = text.match(/[A-Za-z']+|[^A-Za-z']+/g) || [];
  tokens.forEach(tok => {
    if (/^[A-Za-z]/.test(tok)) {
      const span = document.createElement('span');
      span.className = 'word';
      span.textContent = tok;
      span.dataset.key = tok.toLowerCase().replace(/'/g, '');
      span.tabIndex = 0;
      frag.appendChild(span);
    } else {
      frag.appendChild(document.createTextNode(tok));
    }
  });
  return frag;
}

function estimateReadingTime(text){
  const words = text.trim().split(/\s+/).length;
  const minutes = Math.max(1, Math.round(words / 130));
  return { words, minutes };
}

function buildCard(reading){
  const { words, minutes } = estimateReadingTime(reading.text);

  const card = document.createElement('article');
  card.className = 'reading-card';
  card.dataset.level = reading.level;
  card.dataset.readingId = reading.id;
  card.dataset.titleSearch = reading.title.toLowerCase();

  // ---- head ----
  const head = document.createElement('div');
  head.className = 'card-head';
  head.innerHTML = `
    <span class="level-badge">${levelLabels[reading.level]}</span>
    <span class="meta-info">${words} palabras<br>~${minutes} min de lectura</span>
  `;
  card.appendChild(head);

  const title = document.createElement('h3');
  title.className = 'card-title';
  title.textContent = reading.title;
  card.appendChild(title);

  const subtitle = document.createElement('p');
  subtitle.className = 'card-subtitle';
  subtitle.textContent = reading.subtitle;
  card.appendChild(subtitle);

  // ---- reading text ----
  const textEl = document.createElement('p');
  textEl.className = 'reading-text';
  textEl.appendChild(tokenizeToFragment(reading.text));
  card.appendChild(textEl);

  // ---- translation toggle ----
  const toggleBtn = document.createElement('button');
  toggleBtn.className = 'translation-toggle';
  toggleBtn.setAttribute('aria-expanded', 'false');
  toggleBtn.innerHTML = `<span class="tt-label">Ver traducción completa</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="6 9 12 15 18 9"/></svg>`;
  card.appendChild(toggleBtn);

  const translationBox = document.createElement('div');
  translationBox.className = 'translation-box';
  translationBox.textContent = reading.translation;
  card.appendChild(translationBox);

  toggleBtn.addEventListener('click', () => {
    const isOpen = translationBox.classList.toggle('open');
    toggleBtn.classList.toggle('open', isOpen);
    toggleBtn.querySelector('.tt-label').textContent = isOpen ? 'Ocultar traducción' : 'Ver traducción completa';
    toggleBtn.setAttribute('aria-expanded', String(isOpen));
  });

  // ---- comprehension questions ----
  const qWrap = document.createElement('div');
  qWrap.className = 'questions';
  const qTitle = document.createElement('div');
  qTitle.className = 'questions-title';
  qTitle.textContent = 'Preguntas de comprensión';
  qWrap.appendChild(qTitle);

  reading.questions.forEach((q, qIndex) => {
    const qEl = document.createElement('div');
    qEl.className = 'question';

    const qText = document.createElement('p');
    qText.className = 'q-text';
    qText.textContent = `${qIndex + 1}. ${q.q}`;
    qEl.appendChild(qText);

    const optWrap = document.createElement('div');
    optWrap.className = 'options';

    q.options.forEach((optText, optIndex) => {
      const optBtn = document.createElement('button');
      optBtn.className = 'option-btn';
      optBtn.textContent = optText;
      optBtn.dataset.optIndex = optIndex;
      optBtn.addEventListener('click', () => {
        if (qEl.classList.contains('answered')) return;
        qEl.classList.add('answered');
        const allBtns = optWrap.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        const feedback = qEl.querySelector('.feedback');
        if (optIndex === q.correct) {
          optBtn.classList.add('correct');
          feedback.textContent = '¡Correcto! ' + q.explanation;
          feedback.classList.add('correct-text');
        } else {
          optBtn.classList.add('incorrect');
          allBtns[q.correct].classList.add('correct');
          feedback.textContent = 'Incorrecto. ' + q.explanation;
          feedback.classList.add('incorrect-text');
        }
      });
      optWrap.appendChild(optBtn);
    });

    qEl.appendChild(optWrap);

    const feedback = document.createElement('p');
    feedback.className = 'feedback';
    qEl.appendChild(feedback);

    qWrap.appendChild(qEl);
  });

  card.appendChild(qWrap);

  return card;
}

function renderAllCards(){
  const grid = document.getElementById('reading-grid');
  grid.innerHTML = '';
  readings.forEach(r => grid.appendChild(buildCard(r)));
}


/* =========================================================================
   3. VOCABULARY POPUP — clic en cualquier palabra
   ========================================================================= */

const popup = document.getElementById('vocab-popup');
const popupWordEl = popup.querySelector('.vocab-word');
const popupMeaningEl = popup.querySelector('.vocab-meaning');

function showPopup(wordEl){
  const card = wordEl.closest('.reading-card');
  const reading = readingsById[card.dataset.readingId];
  const key = wordEl.dataset.key;
  const meaning = (reading.glossary && reading.glossary[key]) || commonWords[key];

  popupWordEl.textContent = wordEl.textContent;

  if (meaning) {
    popupMeaningEl.textContent = meaning;
    popup.classList.remove('no-def');
  } else {
    popupMeaningEl.textContent = 'Esta palabra no está en el glosario todavía. Intenta buscarla en un diccionario.';
    popup.classList.add('no-def');
  }

  popup.style.display = 'block';

  const rect = wordEl.getBoundingClientRect();
  const popupWidth = popup.offsetWidth;
  let left = rect.left + window.scrollX;
  const maxLeft = window.scrollX + document.documentElement.clientWidth - popupWidth - 12;
  if (left > maxLeft) left = Math.max(8, maxLeft);
  if (left < 8) left = 8;
  let top = rect.bottom + window.scrollY + 8;

  popup.style.left = left + 'px';
  popup.style.top = top + 'px';

  document.querySelectorAll('.word.active').forEach(w => w.classList.remove('active'));
  wordEl.classList.add('active');
}

function hidePopup(){
  popup.style.display = 'none';
  document.querySelectorAll('.word.active').forEach(w => w.classList.remove('active'));
}

document.addEventListener('click', (e) => {
  const wordEl = e.target.closest('.word');
  if (wordEl) {
    e.stopPropagation();
    showPopup(wordEl);
    return;
  }
  if (!e.target.closest('#vocab-popup')) {
    hidePopup();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') hidePopup();
  if (e.key === 'Enter' && document.activeElement && document.activeElement.classList.contains('word')) {
    showPopup(document.activeElement);
  }
});

document.getElementById('vocab-close').addEventListener('click', (e) => {
  e.stopPropagation();
  hidePopup();
});


/* =========================================================================
   4. FILTROS DE NIVEL + BÚSQUEDA EN TIEMPO REAL
   ========================================================================= */

let currentLevel = 'all';
let currentSearch = '';

function applyFilters(){
  const cards = document.querySelectorAll('.reading-card');
  let visibleCount = 0;

  cards.forEach(card => {
    const levelMatch = currentLevel === 'all' || card.dataset.level === currentLevel;
    const searchMatch = !currentSearch || card.dataset.titleSearch.includes(currentSearch);
    const visible = levelMatch && searchMatch;
    card.style.display = visible ? '' : 'none';
    if (visible) visibleCount++;
  });

  document.getElementById('empty-state').classList.toggle('show', visibleCount === 0);
  document.getElementById('result-count').textContent =
    visibleCount === readings.length ? `${visibleCount} lecturas` : `${visibleCount} de ${readings.length} lecturas`;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLevel = btn.dataset.level;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
    applyFilters();
  });
});

document.getElementById('search-input').addEventListener('input', (e) => {
  currentSearch = e.target.value.trim().toLowerCase();
  applyFilters();
});


/* =========================================================================
   5. BARRA SUPERIOR — cronómetro de sesión y estado de guardado
   ========================================================================= */

let elapsedSeconds = 0;
function formatTime(totalSeconds){
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
setInterval(() => {
  elapsedSeconds++;
  document.getElementById('session-timer').textContent = formatTime(elapsedSeconds);
}, 1000);

function cycleAutosave(){
  const dot = document.getElementById('autosave-dot');
  const label = document.getElementById('autosave-label');
  label.textContent = 'Guardando cambios…';
  dot.classList.add('saving');
  setTimeout(() => {
    label.textContent = 'Todo guardado';
    dot.classList.remove('saving');
  }, 900);
}
setInterval(cycleAutosave, 18000);


/* =========================================================================
   6. INICIALIZACIÓN
   ========================================================================= */

renderAllCards();
applyFilters();
</script>
